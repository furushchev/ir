[package]
name = "wspm"
version = "0.1.0"
edition = "2021"
description = "Workspace package manager: recursively resolve .repos/.rosinstall dependencies, pin versions in a lockfile, and sync repositories into a workspace"
license = "MIT"

[lib]
name = "wspm_core"
path = "src/lib.rs"

[[bin]]
name = "wspm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
url = "2"
