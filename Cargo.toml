[package]
name = "wspm"
version = "0.1.0"
edition = "2021"
description = "Workspace package manager: recursively resolve .repos/.rosinstall dependencies, pin versions in a lockfile, and sync repositories into a workspace"
license = "MIT"

[lib]
name = "wspm_core"
path = "src/lib.rs"

[[bin]]
name = "wspm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
url = "2"
wait-timeout = "0.2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
tar = "0.4"
zip = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
dirs = "6"
